<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Served from a phone</title>
<style>
  :root { color-scheme: light dark; --fg: #1a1a1a; --bg: #fbfbfd; --card: #fff; --line: #e5e5ea; --accent: #512BD4; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #f2f2f7; --bg: #111114; --card: #1c1c20; --line: #2c2c32; --accent: #a78bfa; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 2rem 1rem 4rem; font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         color: var(--fg); background: var(--bg); }
  main { max-width: 34rem; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .sub { color: #8e8e93; margin: 0 0 2rem; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 1.1rem 1.25rem; margin-bottom: 1rem; }
  h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: #8e8e93; margin: 0 0 .75rem; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: .4rem 1rem; margin: 0; }
  dt { color: #8e8e93; }
  dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: .55rem 0; border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: 0; }
  li small { display: block; color: #8e8e93; font-size: .75rem; }
  form { display: flex; gap: .5rem; margin-top: .9rem; }
  input { flex: 1; padding: .6rem .8rem; font: inherit; color: var(--fg); background: var(--bg);
          border: 1px solid var(--line); border-radius: 9px; }
  button { padding: .6rem 1rem; font: inherit; font-weight: 600; color: #fff; background: var(--accent);
           border: 0; border-radius: 9px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<main>
  <h1>Served from a phone</h1>
  <p class="sub">This page, and everything on it, came from an app on a mobile device.</p>

  <section>
    <h2>The device</h2>
    <dl id="device"><dt>Loading…</dt><dd></dd></dl>
  </section>

  <section>
    <h2>Notes</h2>
    <ul id="notes"></ul>
    <form id="add">
      <input id="text" placeholder="Add a note" autocomplete="off" required>
      <button type="submit">Add</button>
    </form>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);

const rows = {
  Name: 'name', Model: 'model', Manufacturer: 'manufacturer', Platform: 'platform',
  Version: 'version', Idiom: 'idiom'
};

async function loadDevice() {
  const device = await (await fetch('/api/device')).json();
  const battery = device.batteryLevel < 0 ? 'unknown' : Math.round(device.batteryLevel * 100) + '% (' + device.powerState + ')';

  $('device').innerHTML =
    Object.entries(rows).map(([label, key]) => `<dt>${label}</dt><dd>${device[key] ?? '—'}</dd>`).join('') +
    `<dt>Battery</dt><dd>${battery}</dd>` +
    `<dt>Physical device</dt><dd>${device.isPhysicalDevice ? 'yes' : 'no (simulator)'}</dd>`;
}

async function loadNotes() {
  const notes = await (await fetch('/api/notes')).json();

  $('notes').innerHTML = notes.length === 0
    ? '<li>No notes yet.</li>'
    : notes.map(n => `<li>${escapeHtml(n.text)}<small>${new Date(n.createdUtc).toLocaleString()}</small></li>`).join('');
}

// The note text is whatever someone typed, so it is escaped rather than trusted — the same care
// the server takes with an unknown file extension.
function escapeHtml(value) {
  return value.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

$('add').addEventListener('submit', async (e) => {
  e.preventDefault();

  const input = $('text');
  const text = input.value.trim();
  if (!text) return;

  const button = e.target.querySelector('button');
  button.disabled = true;

  try {
    await fetch('/api/notes', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });

    input.value = '';
    await loadNotes();
  } finally {
    button.disabled = false;
  }
});

loadDevice();
loadNotes();
setInterval(loadNotes, 5000);
</script>
</body>
</html>
